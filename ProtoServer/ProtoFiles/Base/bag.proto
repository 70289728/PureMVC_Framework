syntax = "proto3";

import "network_module.proto";

// Single item in bag
message BagItem {
    int32 itemId = 1;
    int32 count = 2;
}

// ── List ──
message BagListC2S {}
message BagListS2C {
    repeated BagItem items = 1;
    int32 maxSlots = 2;
}

// ── Use item ──
message BagUseC2S {
    int32 itemId = 1;
    int32 count = 2;
}
message BagUseS2C {
    S2CResult rst = 1;
    int32 itemId = 2;
    int32 remaining = 3;
}

// ── Sell / Recycle ──
message BagSellC2S {
    int32 itemId = 1;
    int32 count = 2;
}
message BagSellS2C {
    S2CResult rst = 1;
    int32 goldGained = 2;
}
